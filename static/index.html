<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>社媒账号数据汇总</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>社媒账号数据汇总</h1>
        <p id="statusText" aria-live="polite">正在读取数据库状态...</p>
      </div>
      <div class="actions">
        <button id="settingsButton" type="button" class="icon-button" title="设置" aria-label="设置">
          <span aria-hidden="true">⚙</span>
        </button>
        <button id="refreshAccounts" type="button" class="secondary">刷新账号</button>
        <button id="fetchRecent" type="button">三天数据</button>
        <button id="fetchFull" type="button">全量数据</button>
        <span id="fetchProgress" class="fetch-progress hidden"></span>
      </div>
    </header>

    <main>
      <section class="toolbar">
        <div class="field mode">
          <label>查询方式</label>
          <div class="segmented">
            <button id="singleMode" type="button" class="active">单日</button>
            <button id="rangeMode" type="button">范围</button>
          </div>
        </div>
        <div class="field single-date">
          <label for="dateInput">日期</label>
          <input id="dateInput" type="date" />
        </div>
        <div class="field range-date hidden">
          <label for="startInput">开始</label>
          <input id="startInput" type="date" />
        </div>
        <div class="field range-date hidden">
          <label for="endInput">结束</label>
          <input id="endInput" type="date" />
        </div>
        <div class="field platform-select">
          <label>平台</label>
          <div class="multi-select" id="platformFilter">
            <button type="button" class="multi-select-trigger" id="platformFilterBtn">
              <span>全部平台</span>
              <span class="arrow">&#9662;</span>
            </button>
            <div class="multi-select-dropdown hidden" id="platformDropdown">
              <div class="multi-select-actions">
                <button type="button" class="secondary" id="selectAllPlatforms">全选</button>
                <button type="button" class="secondary" id="clearAllPlatforms">清除</button>
              </div>
              <div class="multi-select-list" id="platformList"></div>
            </div>
          </div>
        </div>
        <div class="field account-filter">
          <label>账号</label>
          <div class="multi-select" id="accountFilter">
            <button type="button" class="multi-select-trigger" id="accountFilterBtn">
              <span>全部账号</span>
              <span class="arrow">&#9662;</span>
            </button>
            <div class="multi-select-dropdown hidden" id="accountDropdown">
              <div class="multi-select-actions">
                <button type="button" class="secondary" id="selectAllAccounts">全选</button>
                <button type="button" class="secondary" id="clearAllAccounts">清除</button>
              </div>
              <div class="multi-select-list" id="accountList"></div>
            </div>
          </div>
        </div>
        <label class="check merge-only hidden">
          <input id="mergeInput" type="checkbox" />
          <span>合并账号</span>
        </label>
        <label class="check">
          <input id="includeEmptyInput" type="checkbox" />
          <span>包含未更新账号</span>
        </label>
        <div class="button-row">
          <button id="queryButton" type="button">查询</button>
          <button id="csvButton" type="button" class="secondary">下载 CSV</button>
          <button id="mergeBtn" type="button" class="secondary hidden">合并账号</button>
        </div>
      </section>

      <section class="summary">
        <div>
          <span class="label">账号数</span>
          <strong id="accountCount">-</strong>
        </div>
        <div>
          <span class="label">指标记录</span>
          <strong id="metricCount">-</strong>
        </div>
        <div>
          <span class="label">日期范围</span>
          <strong id="dateRange">-</strong>
        </div>
        <div>
          <span class="label">当前结果</span>
          <strong id="rowCount">-</strong>
        </div>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:34px"><input type="checkbox" id="selectAllCheckbox" title="全选"></th>
              <th class="sortable" data-sort="metric_date">日期</th>
              <th class="sortable" data-sort="platform_name">平台</th>
              <th class="sortable" data-sort="platform_account_name">账号昵称</th>
              <th class="sortable" data-sort="platform_account_id">账号ID</th>
              <th class="sortable numeric" data-sort="fans">粉丝</th>
              <th class="sortable numeric" data-sort="play">播放/阅读</th>
              <th class="sortable numeric" data-sort="like">点赞</th>
              <th class="sortable numeric" data-sort="comment">评论</th>
              <th class="sortable numeric" data-sort="collect">收藏</th>
              <th class="sortable numeric" data-sort="publish_count">发布数</th>
              <th class="sortable" data-sort="login_status">登录状态</th>
            </tr>
          </thead>
          <tbody id="rowsBody">
            <tr><td colspan="12" class="empty">暂无数据</td></tr>
          </tbody>
          <tfoot>
            <tr id="totalRow">
              <td></td>
              <td>总计</td>
              <td>-</td>
              <td id="totalCount">0 行</td>
              <td>-</td>
              <td id="totalFans" class="numeric">-</td>
              <td id="totalPlay" class="numeric">-</td>
              <td id="totalLike" class="numeric">-</td>
              <td id="totalComment" class="numeric">-</td>
              <td id="totalCollect" class="numeric">-</td>
              <td id="totalPublish" class="numeric">-</td>
              <td>-</td>
            </tr>
          </tfoot>
        </table>
      </section>
    </main>


    <dialog id="settingsDialog">
      <form method="dialog">
        <header>
          <h2>设置</h2>
          <button value="close" type="submit" class="icon">×</button>
        </header>

        <div class="settings-section">
          <h3>API Key</h3>
          <div class="field wide">
            <span>蚁小二 API Key</span>
            <input id="settingsApiKeyInput" type="password" autocomplete="off" placeholder="输入新 API Key；已保存的 Key 不会回显" />
          </div>
          <div class="dialog-actions">
            <button id="saveSettings" type="button">保存</button>
            <button id="clearSettings" type="button" class="secondary">清除</button>
          </div>
          <p id="settingsMessage" class="dialog-message"></p>
        </div>

        <hr />

        <div class="settings-section">
          <h3>自动同步</h3>
          <label class="check">
            <input id="scheduleEnabled" type="checkbox" />
            <span>启用定时更新</span>
          </label>
          <div class="schedule-row">
            <div class="field">
              <label for="scheduleInterval">间隔</label>
              <select id="scheduleInterval">
                <option value="60">1 小时</option>
                <option value="120">2 小时</option>
                <option value="240">4 小时</option>
                <option value="360" selected>6 小时</option>
                <option value="720">12 小时</option>
                <option value="1440">24 小时</option>
              </select>
            </div>
            <div class="field">
              <label for="scheduleMode">模式</label>
              <select id="scheduleMode">
                <option value="latest" selected>三天数据</option>
                <option value="full">全量</option>
              </select>
            </div>
          </div>
          <label class="check">
            <input id="schedulePreRefresh" type="checkbox" />
            <span>同步前刷新账号</span>
          </label>
          <div class="dialog-actions">
            <button id="saveSchedule" type="button">保存同步设置</button>
          </div>
          <p id="scheduleMessage" class="dialog-message"></p>
        </div>
      </form>
    </dialog>

    <dialog id="mergeDialog">
      <header>
        <h2>合并账号</h2>
        <button id="mergeClose" type="button" class="icon">&times;</button>
      </header>
      <div id="mergeContent" style="padding:0 16px">
        <p>正在查询账号详情...</p>
      </div>
      <div class="dialog-actions" style="padding:12px 16px">
        <button id="mergeCancel" type="button" class="secondary">取消</button>
        <button id="mergeConfirm" type="button" disabled>确认合并</button>
      </div>
    </dialog>

    <script type="module" src="/static/js/main.js"></script>

  </body>
</html>
